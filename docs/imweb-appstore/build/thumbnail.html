<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('file:///C:/Users/ceo/AppData/Local/Microsoft/Windows/Fonts/Pretendard-Bold.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url('file:///C:/Users/ceo/AppData/Local/Microsoft/Windows/Fonts/Pretendard-ExtraBold.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url('file:///C:/Users/ceo/AppData/Local/Microsoft/Windows/Fonts/Pretendard-Medium.otf') format('opentype'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 992px; height: 558px; overflow: hidden; }
  body { font-family: 'Pretendard', sans-serif; background: #090c15; position: relative; }
  .glow1 { position: absolute; width: 720px; height: 720px; right: -180px; top: -300px; background: radial-gradient(circle, rgba(168,85,247,0.20) 0%, rgba(168,85,247,0) 62%); }
  .glow2 { position: absolute; width: 560px; height: 560px; right: 120px; bottom: -300px; background: radial-gradient(circle, rgba(217,70,163,0.14) 0%, rgba(217,70,163,0) 60%); }
  .hairline { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%); }
  .left { position: absolute; left: 64px; top: 0; height: 100%; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .logo { height: 42px; width: auto; align-self: flex-start; margin-bottom: 44px; }
  h1 { font-weight: 700; font-size: 48px; line-height: 1.30; color: #ffffff; letter-spacing: -0.5px; }
  .bar { width: 128px; height: 10px; border-radius: 6px; background: #ffffff; margin-top: 36px; }
  .visual { position: absolute; right: 44px; top: 50%; width: 420px; height: 460px; transform: translateY(-50%); }
  .card { position: absolute; width: 292px; height: 292px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 30px 70px rgba(0,0,0,0.55); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.back  { left: 0; top: 28px; transform: rotate(-6deg); opacity: 0.94; }
  .card.front { right: 0; bottom: 24px; transform: rotate(4deg); }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="hairline"></div>
  <div class="left">
    <img class="logo" src="../assets/logo_white_mark.png" alt="">
    <h1>아임웹 쇼핑몰을 위한<br>AI 마케팅 자동화</h1>
    <div class="bar"></div>
  </div>
  <div class="visual">
    <div class="card back"><img src="../assets/poster_left.png"></div>
    <div class="card front"><img src="../assets/poster_right.png"></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('z') === '2') { document.body.style.zoom = 2; }
  </script>
</body>
</html>
