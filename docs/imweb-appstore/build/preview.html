<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('file:///C:/Users/ceo/AppData/Local/Microsoft/Windows/Fonts/Pretendard-SemiBold.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url('file:///C:/Users/ceo/AppData/Local/Microsoft/Windows/Fonts/Pretendard-Medium.otf') format('opentype'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 820px; height: 508px; overflow: hidden; }
  body { font-family: 'Pretendard', sans-serif; background: #0a0d16; position: relative; }
  .glow1 { position: absolute; width: 640px; height: 640px; left: -220px; top: -340px; background: radial-gradient(circle, rgba(168,85,247,0.14) 0%, rgba(168,85,247,0) 62%); }
  .glow2 { position: absolute; width: 560px; height: 560px; right: -200px; bottom: -320px; background: radial-gradient(circle, rgba(217,70,163,0.11) 0%, rgba(217,70,163,0) 60%); }
  .pill { position: absolute; left: 28px; top: 18px; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 16px; border-radius: 999px; background: rgba(15,18,32,0.92); border: 1px solid rgba(255,255,255,0.14); z-index: 3; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #e879f9; }
  .pill .num { color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 600; }
  .pill .txt { color: #ffffff; font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
  .card { position: absolute; left: 28px; right: 28px; top: 66px; bottom: 26px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.13); box-shadow: 0 22px 60px rgba(0,0,0,0.5); background: #10131f; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="pill"><span class="dot"></span><span class="num" id="num"></span><span class="txt" id="txt"></span></div>
  <div class="card"><img id="shot" src=""></div>
  <script>
    const shots = [
      { img: '../assets/스크린샷 2026-07-19 232214.png', txt: '완성 포스터 — 상품 사진 한 장으로 AI가 만듭니다' },
      { img: '../assets/스크린샷 2026-07-19 231851.png', txt: '이미지 스튜디오 — 템플릿 고르고 상품·문구만 넣으면 끝' },
      { img: '../assets/스크린샷 2026-07-19 232236.png', txt: '모바일 DM 편집기 — 연동 상품·가격이 그대로 콘텐츠로' },
      { img: '../assets/스크린샷 2026-07-19 232300.png', txt: '인앱 메시지 — 실시간 미리보기로 편집' },
      { img: '../assets/스크린샷 2026-07-19 232327.png', txt: 'AI 여정 설계 — 시점·타겟·문구를 알아서' },
    ];
    const p = new URLSearchParams(location.search);
    const n = parseInt(p.get('n') || '1', 10);
    document.getElementById('shot').src = shots[n - 1].img;
    document.getElementById('txt').textContent = shots[n - 1].txt;
    document.getElementById('num').textContent = String(n).padStart(2, '0');
    if (p.get('z') === '2') { document.body.style.zoom = 2; }
  </script>
</body>
</html>
