<html lang="ko">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink: #111; --sub: #6b6b6b; --line: #e8e8e8; --orange: #FF5A1F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: Pretendard, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 40px; }
  h2 { font-size: 18px; font-weight: 700; margin: 48px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card .big { width: 112px; height: 112px; display: block; }
  .sizes { display: flex; align-items: flex-end; gap: 12px; margin: 18px 0 14px; height: 40px; }
  .sizes img { display: block; image-rendering: auto; }
  .tag { font-size: 13px; font-weight: 800; color: var(--orange); letter-spacing: 0.04em; }
  .name { font-size: 16px; font-weight: 700; margin: 4px 0 6px; }
  .why { font-size: 13px; color: var(--sub); line-height: 1.55; margin: 0; }

  .brand { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 36px; }
  .brand .panel { flex: 1 1 320px; height: 120px; border-radius: 16px; padding: 22px 24px; color: #fff; background: linear-gradient(to right bottom, #059669, #0F766E, #1E40AF); display: flex; flex-direction: column; justify-content: space-between; }
  .brand .panel b { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: flex-end; gap: 6px; }
  .brand .panel b i { display: inline-block; width: 44px; height: 3px; background: #fff; margin-bottom: 6px; }
  .brand .panel span { font-size: 12px; opacity: .8; }
  .brand .btn { flex: 0 1 220px; height: 120px; border-radius: 16px; background: #059669; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* 탭 막대 */
  .strip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 10px 0; border-radius: 12px 12px 0 0; overflow: hidden; }
  .strip + .strip { margin-top: 10px; }
  .tab { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px; width: 230px; border-radius: 9px 9px 0 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  .tab img, .tab .dot { width: 16px; height: 16px; flex: none; display: block; }
  .tab .dot { border-radius: 50%; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { margin-left: auto; opacity: .6; font-size: 13px; }
  .row-label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 14px 0 6px; }
  .dark .strip { background: #1f1f1f; }
  .dark .tab { color: #e3e3e3; }
  .dark .tab.on { background: #3a3a3a; }
  .dark .tab .dot { background: #5a5a5a; }
  .light .strip { background: #dfe3e8; }
  .light .tab { color: #1f1f1f; }
  .light .tab.on { background: #ffffff; }
  .light .tab .dot { background: #a9adb3; }

  /* 홈 화면 */
  .home { display: flex; gap: 28px; flex-wrap: wrap; background: #e9e4dc; border-radius: 16px; padding: 28px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: #111; }
  .app img { width: 60px; height: 60px; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } .tab { width: 170px; } }
  @media (max-width: 520px) { main { padding: 32px 16px 60px; } .grid { grid-template-columns: 1fr; } .tab { width: 140px; padding: 0 10px; } .strip { overflow-x: auto; } }
</style>
</head>
