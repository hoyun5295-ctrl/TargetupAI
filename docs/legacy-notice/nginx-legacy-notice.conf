# 레거시 143 폐기 — 안내 3장 정적 서빙 (66번 서버 58.227.193.66 / Ubuntu 24.04 · nginx 1.24.0)
#
# 배치:
#   /etc/nginx/sites-available/legacy-notice  (이 파일)
#   /etc/nginx/sites-enabled/legacy-notice    (심볼릭 링크)
#   /var/www/legacy-notice/{invitobiz,template-admin,pay}-notice.html
#
# 주의 1) default_server를 지정하지 않는다. 66의 암묵 기본값은 첫 서버 블록(invito-groupware)이고
#         sites-enabled/*가 알파벳 순으로 전개되어 invito-groupware < legacy-notice 순서가 유지된다.
#         여기에 default_server를 넣으면 그룹웨어(groupware.invitocorp.com)를 가로챈다.
# 주의 2) 루트에 단일 파일을 물릴 때 location = / 에 alias를 쓰면 500(2026-07-28 143 실측).
#         root + try_files 로만 건다. 아래 location / 는 전 경로를 안내 한 장으로 흡수한다.
# 주의 3) pay는 북마크가 :8080까지 물고 있어 80과 8080을 함께 listen 한다.
# 주의 4) 443/SSL 지시어는 여기 쓰지 않는다. DNS 전환 후 certbot --nginx 가 추가한다.

server {
    listen 80;
    listen [::]:80;
    server_name invitobiz.com www.invitobiz.com;

    root /var/www/legacy-notice;
    access_log /var/log/nginx/legacy-notice.access.log;

    location / {
        try_files /invitobiz-notice.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name event-admin.invitocorp.com;

    root /var/www/legacy-notice;
    access_log /var/log/nginx/legacy-notice.access.log;

    location / {
        try_files /template-admin-notice.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name pay.invitobiz.com;

    root /var/www/legacy-notice;
    access_log /var/log/nginx/legacy-notice.access.log;

    location / {
        try_files /pay-notice.html =404;
    }
}
