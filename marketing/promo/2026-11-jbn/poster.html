<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>JBN 포스터</title>
<!-- 단톡방 홍보 포스터 원판(1080x1350 · 렌더 = render-poster.cjs · 사진 = 생성 모델 실물 poster-photo.jpg) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:#fff;color:#0B0B0C;-webkit-font-smoothing:antialiased;word-break:keep-all}
.p{position:relative;width:1080px;height:1350px;padding:76px 76px 70px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:46px;font-weight:900;letter-spacing:-.045em}
.tag{font-size:25px;font-weight:800;color:#B53C0D;background:#FBEEE7;padding:12px 22px;border-radius:99px}
h1{margin-top:50px;font-size:104px;font-weight:900;line-height:1.12;letter-spacing:-.05em}
h1 em{font-style:normal;color:#CF4510}
.sub{margin-top:30px;font-size:33px;line-height:1.55;color:#5F6368;letter-spacing:-.02em}
.ph{margin-top:42px;height:396px;border-radius:40px;background:url(poster-photo.jpg) 72% 38% / cover no-repeat #EEE}
.offer{position:relative;margin:-96px 28px 0;background:#0B0B0C;color:#fff;border-radius:30px;padding:30px 38px 32px}
.offer small{display:block;font-size:24px;font-weight:800;color:#FF8A5C;letter-spacing:-.01em}
.offer b{display:block;margin-top:10px;font-size:47px;font-weight:900;letter-spacing:-.045em;line-height:1.2}
.offer b em{font-style:normal;color:#FF8A5C}
.offer span{display:block;margin-top:10px;font-size:27px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:-.02em}
.foot{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between}
.foot b{font-size:38px;font-weight:900;letter-spacing:-.03em}
.foot span{font-size:24px;font-weight:600;color:#6B6B70}
</style>
</head>
<body>
<div class="p">
  <div class="top"><span class="logo">한줄로</span><span class="tag">JBN 회원 전용</span></div>
  <h1>고객관리,<br>이제 <em>한 줄</em>이면<br>됩니다</h1>
  <p class="sub">카톡과 문자 발송, 고객 관리, 홍보 포스터까지<br>한줄로 하나로 끝납니다</p>
  <div class="ph"></div>
  <div class="offer">
    <small>JBN 대표님 특별가</small>
    <b>모든 요금제 월 구독료 <em>30% 평생 할인</em></b>
    <span>문자와 카톡 발송 단가는 온라인 최저가 수준</span>
  </div>
  <div class="foot"><b>hanjul.ai/jbn</b><span>JBN 전용 신청 페이지</span></div>
</div>
</body>
</html>
