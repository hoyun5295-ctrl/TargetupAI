    <!-- 소스 보호: 우클릭 · 개발자도구 단축키 차단 · 글자 선택은 막지 않는다(★2026-11-24 뿌리 R107 · 설계서 docs/2026-11-24-copy-selection-root-design.md) -->
    <script>
      (function() {
        // 우클릭 차단 — 슈퍼관리자로 로그인한 탭만 연다(<html data-ctx-menu="open"> · 다는 곳 = src/utils/text-select.ts bindAdminContextMenu)
        document.addEventListener('contextmenu', function(e) {
          if (document.documentElement.getAttribute('data-ctx-menu') === 'open') return;
          e.preventDefault();
        });

        // 키보드 단축키 차단
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12') { e.preventDefault(); return; }
          // Ctrl+Shift+I (개발자도구)
          if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return; }
          // Ctrl+Shift+J (콘솔)
          if (e.ctrlKey && e.shiftKey && e.key === 'J') { e.preventDefault(); return; }
          // Ctrl+Shift+C (요소 선택)
          if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); return; }
          // Ctrl+U (소스보기)
          if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }
        });
      })();
    </script>
