<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>한줄로 — AI Operator 소개</title>
<meta name="description" content="한줄로 AI Operator — 마케터의 자연어 한 줄, AI가 마케팅 전체를 운영합니다. 단, 실행은 항상 사용자가 승인합니다." />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
  :root { --bg:#060a14; --panel:#0c1322; --line:rgba(255,255,255,0.10); --muted:rgba(255,255,255,0.55); --accent:#7c6cf0; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:#fff;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100dvh; }

  /* 상단 바 */
  header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--line); background:rgba(8,12,22,0.7); backdrop-filter:blur(8px); }
  .brand { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .brand b { font-size:16px; font-weight:700; letter-spacing:-0.02em; }
  .brand span { font-size:12px; color:var(--muted); white-space:nowrap; }
  .top-right { display:flex; align-items:center; gap:10px; }
  .counter { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); letter-spacing:0.04em; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
    border:1px solid var(--line); background:rgba(255,255,255,0.04); border-radius:10px; color:#fff; cursor:pointer; transition:background .15s; }
  .icon-btn:hover { background:rgba(255,255,255,0.10); }

  /* 슬라이드 무대 */
  .stage { flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center;
    padding:18px clamp(14px, 6vw, 88px); min-height:0; }
  .slide-wrap { position:relative; width:100%; max-width:1280px; aspect-ratio:16/9; max-height:100%;
    border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.55); background:#000; }
  .slide-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000;
    opacity:0; transition:opacity .22s ease; }
  .slide-wrap img.on { opacity:1; }

  .nav { position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%;
    border:1px solid var(--line); background:rgba(10,14,24,0.7); color:#fff; cursor:pointer; display:flex;
    align-items:center; justify-content:center; backdrop-filter:blur(6px); transition:background .15s, opacity .15s; z-index:5; }
  .nav:hover { background:rgba(124,108,240,0.55); }
  .nav[disabled] { opacity:0.25; cursor:default; }
  .nav.prev { left:clamp(6px,2.5vw,28px); }
  .nav.next { right:clamp(6px,2.5vw,28px); }

  /* 하단 인디케이터 */
  footer { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 16px 16px; }
  .dots { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; max-width:680px; }
  .dot { width:9px; height:9px; border-radius:50%; border:none; padding:0; cursor:pointer;
    background:rgba(255,255,255,0.22); transition:background .15s, transform .15s; }
  .dot:hover { background:rgba(255,255,255,0.45); }
  .dot.on { background:var(--accent); transform:scale(1.25); }
  .hint { font-size:11px; color:rgba(255,255,255,0.32); letter-spacing:0.02em; }

  @media (max-width:640px) {
    .brand span { display:none; }
    .stage { padding:10px; }
    .nav { width:38px; height:38px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>한줄로</b><span>AI Operator 소개</span></div>
    <div class="top-right">
      <span class="counter" id="counter">01 / 17</span>
      <button class="icon-btn" id="fsBtn" title="전체화면" aria-label="전체화면">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <button class="nav prev" id="prevBtn" aria-label="이전 슬라이드">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="slide-wrap">
      <img id="slideA" alt="" />
      <img id="slideB" alt="" />
    </div>
    <button class="nav next" id="nextBtn" aria-label="다음 슬라이드">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <footer>
    <div class="dots" id="dots"></div>
    <div class="hint">← → 방향키 · 클릭 · 스와이프로 넘기세요</div>
  </footer>
</div>

<script>
(function () {
  var TOTAL = 17;
  var BASE = '/about-ai-operator/slide-';
  var cur = 1;
  var imgs = [document.getElementById('slideA'), document.getElementById('slideB')];
  var front = 0;
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var dotsEl = document.getElementById('dots');
  var fsBtn = document.getElementById('fsBtn');

  // 점 생성
  var dots = [];
  for (var i = 1; i <= TOTAL; i++) {
    (function (n) {
      var b = document.createElement('button');
      b.className = 'dot';
      b.setAttribute('aria-label', n + '번 슬라이드');
      b.addEventListener('click', function () { show(n); });
      dotsEl.appendChild(b);
      dots.push(b);
    })(i);
  }

  function preload(n) {
    if (n >= 1 && n <= TOTAL) { var im = new Image(); im.src = BASE + n + '.png'; }
  }

  function show(n) {
    n = Math.max(1, Math.min(TOTAL, n));
    if (n === cur && imgs[front].classList.contains('on')) return;
    cur = n;
    var back = 1 - front;
    var nextImg = imgs[back];
    nextImg.onload = function () {
      imgs[front].classList.remove('on');
      nextImg.classList.add('on');
      front = back;
    };
    nextImg.alt = 'AI Operator 소개 슬라이드 ' + n;
    nextImg.src = BASE + n + '.png';
    if (nextImg.complete) nextImg.onload();
    counter.textContent = (n < 10 ? '0' + n : n) + ' / ' + TOTAL;
    prevBtn.disabled = (n === 1);
    nextBtn.disabled = (n === TOTAL);
    for (var k = 0; k < dots.length; k++) dots[k].className = 'dot' + (k + 1 === n ? ' on' : '');
    try { history.replaceState(null, '', '#' + n); } catch (e) {}
    preload(n + 1); preload(n - 1);
  }

  prevBtn.addEventListener('click', function () { show(cur - 1); });
  nextBtn.addEventListener('click', function () { show(cur + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') { show(1); }
    else if (e.key === 'End') { show(TOTAL); }
  });

  // 스와이프
  var tx = 0, ty = 0;
  var stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', function (e) { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { show(cur + (dx < 0 ? 1 : -1)); }
  }, { passive: true });

  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); }
  });

  var startN = parseInt((location.hash || '').replace('#', ''), 10);
  show(startN >= 1 && startN <= TOTAL ? startN : 1);
})();
</script>
</body>
</html>
