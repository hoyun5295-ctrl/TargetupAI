function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function useTypewriter(text, speed = 22, startDelay = 0, runId = 0) {
  const [out, setOut] = useState('');
  const [done, setDone] = useState(false);
  useEffect(() => {
    setOut(''); setDone(false);
    let i = 0; let timer = null;
    const start = setTimeout(() => {
      timer = setInterval(() => {
        i += 1;
        setOut(text.slice(0, i));
        if (i >= text.length) { clearInterval(timer); setDone(true); }
      }, speed);
    }, startDelay);
    return () => { clearTimeout(start); if (timer) clearInterval(timer); };
  }, [text, speed, startDelay, runId]);
  return [out, done];
}

function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
  const ref = useReveal();
  return <Tag ref={ref} className={`reveal ${className}`} {...rest}>{children}</Tag>;
}

function SideNav() {
  const [active, setActive] = useState('hero');
  useEffect(() => {
    const els = SECTIONS.map(s => document.getElementById(s.id)).filter(Boolean);
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <nav className="hidden xl:flex fixed right-8 top-1/2 -translate-y-1/2 flex-col gap-2.5 z-30">
      {SECTIONS.map(s => (
        <a
          key={s.id} href={`#${s.id}`}
          className="group flex items-center gap-2.5 text-[11px] font-mono"
          style={{ color: active === s.id ? 'var(--fg)' : 'var(--fg-2)' }}
        >
          <span
            className="block h-px transition-all"
            style={{
              width: active === s.id ? 24 : 12,
              background: active === s.id ? ACCENT : 'var(--line)',
            }}
          />
          <span className="opacity-0 group-hover:opacity-100 transition-opacity">{s.label}</span>
        </a>
      ))}
    </nav>
  );
}

function LiveDemo() {
  const [idx, setIdx] = useState(0);
  const [runId, setRunId] = useState(0);
  const sample = SAMPLES[idx];

  const [typedInput, inputDone] = useTypewriter(sample.input, 28, 280, runId);
  const [stage, setStage] = useState(0);

  useEffect(() => { setStage(0); }, [idx, runId]);
  useEffect(() => {
    if (!inputDone) return;
    const t = [];
    t.push(setTimeout(() => setStage(1),  300));
    t.push(setTimeout(() => setStage(2), 1100));
    t.push(setTimeout(() => setStage(3), 1700));
    t.push(setTimeout(() => setStage(4), 2300));
    t.push(setTimeout(() => setIdx(i => (i + 1) % SAMPLES.length), 5800));
    return () => t.forEach(clearTimeout);
  }, [inputDone, idx, runId]);

  return (
    <div className="rounded-2xl border p-5 sm:p-6 card-lift" style={{ borderColor: 'var(--line)', background: 'var(--bg-2)' }}>
      <div className="flex items-center gap-1.5 mb-4 flex-wrap">
        {SAMPLES.map((s, i) => (
          <button key={s.industry} onClick={() => { setIdx(i); setRunId(r => r + 1); }}
            className="px-3 py-1.5 text-[11px] rounded-full transition"
            style={{
              background: i === idx ? 'var(--fg)' : 'transparent',
              color: i === idx ? 'var(--bg)' : 'var(--fg-2)',
              border: `1px solid ${i === idx ? 'var(--fg)' : 'var(--line)'}`,
            }}>{s.industry}</button>
        ))}
        <span className="ml-auto text-[11px] font-mono" style={{ color: 'var(--fg-2)' }}>live demo</span>
      </div>

      <div className="flex items-start gap-3 px-4 py-3.5 rounded-xl" style={{ background: 'var(--bg)', border: '1px solid var(--line)' }}>
        <span className="mt-0.5 text-[11px] font-mono select-none" style={{ color: 'var(--fg-2)' }}>입력</span>
        <div className="flex-1 font-mono text-[14px] leading-relaxed">
          {typedInput}{!inputDone && <span className="caret" />}
        </div>
      </div>

      <div className="flex items-center justify-center my-3" style={{ color: 'var(--line)' }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4v16m0 0l6-6m-6 6l-6-6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>

      <div className="px-4 py-3.5 rounded-xl" style={{ background: 'var(--bg)', border: `1px solid ${ACCENT}40` }}>
        <div className="flex items-center gap-2 mb-2.5">
          <span className="text-[11px] font-mono" style={{ color: ACCENT }}>출력</span>
          <span className="inline-flex items-center gap-1 text-[10px] text-violet-600">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/></svg>
            AI
          </span>
          {stage === 1 && (
            <span className="text-[11px] inline-flex items-center gap-1.5" style={{ color: 'var(--fg-2)' }}>
              <span className="h-1.5 w-1.5 rounded-full bg-neutral-300 animate-pulse"></span>
              생성 중
            </span>
          )}
        </div>
        <div className="space-y-2 text-[14px] leading-relaxed min-h-[88px]">
          {sample.output.map((line, i) => (
            <div key={i} className={`transition-all duration-500 ${stage >= i + 2 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'}`}>
              {line.split(/(\{\{[^}]+\}\})/g).map((seg, j) =>
                seg.startsWith('{{')

        </div>
        <div className="mt-4 flex items-center justify-between text-[11px] font-mono" style={{ color: 'var(--fg-2)' }}>
          <span>가나다 78자 · LMS</span>
          <span style={{ color: ACCENT }}>30초 · 발송 준비 완료</span>
        </div>
      </div>
    </div>
  );
