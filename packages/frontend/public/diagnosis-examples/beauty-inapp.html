<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>톤메이트 — 인앱메시지</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#E7E5EA;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(23,18,31,.28)}
.scr{position:relative;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#fff;color:#17121F}
.app{position:absolute;inset:0;filter:blur(7px);transform:scale(1.06)}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.ah{padding:4px 20px 14px}
.ah b{font-family:Georgia,serif;font-size:17px;letter-spacing:.14em}
.srch{margin:0 20px 16px;height:40px;background:#F3F0F7;border-radius:20px}
.chips{display:flex;gap:9px;padding:0 20px 16px}
.chips span{font-size:13px;padding:9px 15px;background:#F3F0F7;border-radius:18px}
.chips span:first-child{background:#17121F;color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 20px}
.g .t{aspect-ratio:1/1;background:#EDE9F3;border-radius:10px}
.g .l1{height:11px;width:70%;background:#F0EDF4;margin-top:10px;border-radius:2px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #F0EDF4;display:flex;align-items:center;justify-content:space-around;padding-bottom:14px}
.tabbar i{display:block;width:22px;height:22px;border:2px solid #CFC8DA;border-radius:5px}
.tabbar i:first-child{border-color:#17121F}
.dim{position:absolute;inset:0;background:rgba(23,18,31,.56)}
.sheet{position:absolute;left:16px;right:16px;top:78px;bottom:34px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 28px 64px rgba(23,18,31,.5);display:flex;flex-direction:column}
/* 이미지 슬롯: inapp 1:1 */
.pic{position:relative;aspect-ratio:1/1;flex:0 0 auto;background:#eee}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(23,18,31,.42);display:flex;align-items:center;justify-content:center}
.tx{flex:1;padding:28px 26px 24px;display:flex;flex-direction:column}
.chip{align-self:flex-start;background:#FF3E6C;color:#fff;font-size:12px;font-weight:800;padding:7px 12px;border-radius:100px}
h1{font-size:28px;line-height:1.36;font-weight:800;letter-spacing:-0.032em;margin:16px 0 0;text-wrap:pretty}
.sub{font-size:15px;line-height:1.6;color:#6E6680;margin:10px 0 0}
.sp{flex:1;min-height:12px}
.cta{display:block;background:#17121F;color:#fff;text-align:center;font-size:17px;font-weight:700;padding:19px 12px;border-radius:100px;letter-spacing:-0.015em}
.later{display:block;text-align:center;font-size:14px;color:#8B8399;padding:14px 0 0}
</style>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="app">
    <div class="sb"><span>9:41</span><span>
      <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x=".6" y=".6" width="20" height="9.8" rx="3" fill="none" stroke="#17121F" stroke-opacity=".5"/><rect x="2.3" y="2.3" width="13" height="6.4" rx="1.6" fill="#17121F"/></svg>
    </span></div>
    <div class="ah"><b>TONEMATE</b></div>
    <div class="srch"></div>
    <div class="chips"><span>신제품</span><span>스킨케어</span><span>앰플</span><span>세트</span></div>
    <div class="g">
      <div><div class="t"></div><div class="l1"></div></div>
      <div><div class="t"></div><div class="l1"></div></div>
      <div><div class="t"></div><div class="l1"></div></div>
      <div><div class="t"></div><div class="l1"></div></div>
    </div>
    <div class="tabbar"><i></i><i style="border-radius:50%"></i><i></i><i style="border-radius:11px"></i></div>
  </div>
  <div class="dim"></div>

  <div class="sheet">
    <div class="pic slot">
      <img src="./assets/beauty-inapp.png" alt="">
      <a class="x" href="#"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1 11 11M11 1 1 11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>
    </div>
    <div class="tx">
      <span class="chip">골드 선공개</span>
      <h1>당기는 계절이<br>왔어요</h1>
      <p class="sub">리커버 앰플, 골드 회원 먼저 15%</p>
      <div class="sp"></div>
      <a class="cta" href="#">선공개 보러 가기</a>
      <a class="later" href="#">다음에 볼게요</a>
    </div>
  </div>
</div></div>
</body>
</html>
