<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>트립로그 — 모바일DM</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#E3E6EA;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(16,35,63,.3)}
.scr{position:relative;display:flex;flex-direction:column;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#fff;color:#10233F}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:5;color:#fff;font-size:14px;font-weight:600}
.sb .ic{display:flex;gap:6px;align-items:center}
/* 이미지 슬롯: dm hero 9:16 상단 60% */
.hero{position:relative;height:428px}
.hero .slot{position:absolute;inset:0;background:#33506f}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,35,63,.5) 0%,rgba(16,35,63,0) 30%,rgba(16,35,63,.1) 48%,rgba(16,35,63,.9) 100%)}
.wm{position:absolute;top:60px;left:24px;font-size:17px;font-weight:800;color:#fff;letter-spacing:-0.035em}
.htx{position:absolute;left:24px;right:24px;bottom:26px}
.chip{display:inline-block;background:#FF5A36;color:#fff;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:100px;margin-bottom:14px}
h1{font-size:34px;line-height:1.26;font-weight:800;color:#fff;letter-spacing:-0.038em;margin:0;text-wrap:pretty}
.sub{font-size:15px;line-height:1.6;color:#BACBDF;margin-top:12px}
.body{padding:18px 22px 0}
.t{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.t .l{flex:1}
.t .loc{font-size:12px;font-weight:700;color:#8496AC}
.t b{display:block;font-size:17px;font-weight:800;letter-spacing:-0.028em;margin-top:6px}
.t span{display:block;font-size:12.5px;color:#5C718B;margin-top:5px}
.t .r{text-align:right}
.t .r s{display:block;font-size:12px;color:#95A5B8}
.t .r em{display:block;font-style:normal;font-size:19px;font-weight:800;letter-spacing:-0.035em;margin-top:4px}
.t .r i{display:block;font-style:normal;font-size:12px;font-weight:800;color:#FF5A36;margin-top:5px}
.dl{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:#3E5670;margin-top:14px}
.scr>*{flex:0 0 auto}
.fix{margin-top:auto;background:#fff;border-top:1px solid #EDF1F5;padding:16px 20px 20px}
.cta{display:block;background:#FF5A36;color:#fff;text-align:center;font-size:17px;font-weight:800;padding:20px 12px;border-radius:100px}
.optout{text-align:center;font-size:12px;color:#9AA8B8;margin-top:12px}
</style>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="sb"><span>9:41</span><span class="ic"><svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="4.6" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="9.2" y="2.6" width="3" height="8.4" rx="1" fill="#fff"/><rect x="13.8" width="3" height="11" rx="1" fill="#fff"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x=".6" y=".6" width="20" height="9.8" rx="3" fill="none" stroke="#fff" stroke-opacity=".65"/><rect x="2.3" y="2.3" width="14" height="6.4" rx="1.6" fill="#fff"/></svg></span></div>

  <div class="hero">
    <div class="slot"><img src="./assets/travel-dm-hero.png" alt=""></div>
    <div class="scrim"></div>
    <div class="wm">트립로그</div>
    <div class="htx">
      <span class="chip">추석 연휴 특가 · D-3</span>
      <h1>올 추석,<br>엿새를 쉽니다</h1>
      <p class="sub">9/25 – 9/30 · 남은 좌석만 모았어요</p>
    </div>
  </div>

  <div class="body">
    <div class="t">
      <div class="l"><div class="loc">다낭</div><b>다낭 3박 5일</b><span>직항 왕복 · 조식 포함 · 9/25 출발</span></div>
      <div class="r"><s>729,000</s><em>599,000원</em><i>잔여 12석</i></div>
    </div>
    <div class="t">
      <div class="l"><div class="loc">제주</div><b>제주 2박 3일</b><span>항공 왕복 · 렌터카 포함 · 9/26 출발</span></div>
      <div class="r"><s>389,000</s><em>319,000원</em><i>잔여 5석</i></div>
    </div>
    <div class="dl">
      <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.8" fill="none" stroke="#FF5A36" stroke-width="1.7"/><path d="M8 4.2v4l2.8 1.7" fill="none" stroke="#FF5A36" stroke-width="1.7" stroke-linecap="round"/></svg>
      8월 19일 밤 12시 예약 마감
    </div>
  </div>

  <div class="fix">
    <a class="cta" href="#">남은 좌석 보기</a>
    <div class="optout">(광고) 트립로그 · 무료수신거부 080-000-0000</div>
  </div>
</div></div>
</body>
</html>
