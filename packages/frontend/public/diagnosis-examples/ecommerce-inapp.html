<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데일리박스 — 인앱메시지</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#E3E6EA;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(16,20,24,.28)}
.scr{position:relative;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#fff;color:#101418}
.app{position:absolute;inset:0;filter:blur(6px);transform:scale(1.06)}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.ah{padding:4px 20px 14px;display:flex;align-items:center;justify-content:space-between}
.ah b{font-size:18px;font-weight:800;letter-spacing:-0.035em;color:#2563FF}
.ah i{display:block;width:20px;height:20px;border:2px solid #101418;border-radius:5px}
.srch{margin:0 20px 16px;height:42px;background:#F0F3F7;border-radius:21px}
.promo{margin:0 20px 18px;height:138px;background:#2563FF;border-radius:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.g .t{aspect-ratio:1/1;background:#EEF1F5;border-radius:11px}
.g .l1{height:11px;width:74%;background:#E9EDF2;margin-top:10px;border-radius:2px}
.g .l2{height:13px;width:42%;background:#DFE5EC;margin-top:7px;border-radius:2px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #F0F3F6;display:flex;align-items:center;justify-content:space-around;padding-bottom:14px}
.tabbar i{display:block;width:22px;height:22px;border:2px solid #C6CCD4;border-radius:5px}
.tabbar i:first-child{border-color:#2563FF}
.dim{position:absolute;inset:0;background:rgba(16,20,24,.32)}
.banner{position:absolute;left:14px;right:14px;bottom:94px;background:#fff;border-radius:16px;padding:15px 15px 14px;box-shadow:0 20px 44px rgba(16,32,80,.4)}
.brow{display:flex;align-items:center;gap:13px}
/* 이미지 슬롯: inapp 1:1 */
.thumb{width:50px;height:50px;flex:0 0 50px;border-radius:11px}
.btx{flex:1;min-width:0}
.btx b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-0.024em;line-height:1.35}
.btx span{display:block;font-size:13px;color:#8A939E;margin-top:4px}
.go{flex:0 0 auto;background:#2563FF;color:#fff;font-size:14px;font-weight:800;padding:13px 16px;border-radius:10px}
.x{flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.track{height:7px;background:#E4E9EF;border-radius:4px;margin-top:14px;overflow:hidden}
.track i{display:block;width:89%;height:7px;background:#2563FF;border-radius:4px}
</style>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="app">
    <div class="sb"><span>9:41</span><span>
      <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x=".6" y=".6" width="20" height="9.8" rx="3" fill="none" stroke="#101418" stroke-opacity=".5"/><rect x="2.3" y="2.3" width="12" height="6.4" rx="1.6" fill="#101418"/></svg>
    </span></div>
    <div class="ah"><b>데일리박스</b><i></i></div>
    <div class="srch"></div>
    <div class="promo"></div>
    <div class="g">
      <div><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
      <div><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
      <div><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
      <div><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
    </div>
    <div class="tabbar"><i></i><i style="border-radius:50%"></i><i></i><i style="border-radius:11px"></i></div>
  </div>
  <div class="dim"></div>

  <div class="banner">
    <div class="brow">
      <div class="slot thumb"><img src="./assets/ecommerce-inapp.png" alt=""></div>
      <div class="btx"><b>3,200원만 더 담으면 무료배송</b><span>장바구니 3개 · 26,800원</span></div>
      <a class="go" href="#">보기</a>
      <a class="x" href="#"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1 11 11M11 1 1 11" stroke="#B4BAC1" stroke-width="1.8" stroke-linecap="round"/></svg></a>
    </div>
    <div class="track"><i></i></div>
  </div>
</div></div>
</body>
</html>
