<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#E8E4DF;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(30,20,16,.3)}
.scr{position:relative;display:flex;flex-direction:column;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#FFF6EC;color:#1E1410}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:5;color:#fff;font-size:14px;font-weight:600}
.sb .ic{display:flex;gap:6px;align-items:center}
/* 이미지 슬롯: dm hero 9:16 상단 60% */
.hero{position:relative;height:342px}
.hero .slot{position:absolute;inset:0;background:#6b4a38}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,16,.5) 0%,rgba(30,20,16,0) 30%,rgba(30,20,16,.12) 48%,rgba(30,20,16,.9) 100%)}
.wm{position:absolute;top:60px;left:24px;font-size:17px;font-weight:800;color:#fff;letter-spacing:-0.015em}
.htx{position:absolute;left:24px;right:24px;bottom:26px}
.chip{display:inline-block;background:#FFB020;color:#1E1410;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:6px;margin-bottom:14px}
h1{font-size:33px;line-height:1.28;font-weight:800;color:#fff;letter-spacing:-0.034em;margin:0;text-wrap:pretty}
.body{padding:14px 22px 0}
.coupon{background:#1E1410;color:#fff;border-radius:16px;padding:17px 22px;display:flex;align-items:center;gap:16px}
.coupon .ct{flex:1}
.coupon .k{font-size:12px;font-weight:700;color:#FFB020}
.coupon b{display:block;font-size:20px;font-weight:800;letter-spacing:-0.028em;margin-top:9px;line-height:1.35}
.big{flex:0 0 84px;text-align:center;background:#E8452A;border-radius:12px;padding:14px 6px}
.big i{display:block;font-style:normal;font-size:26px;font-weight:800;letter-spacing:-0.04em}
.big span{display:block;font-size:11.5px;color:#FFD9CF;margin-top:5px}
.m{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid #EFE0D0}
.m:last-of-type{border-bottom:0}
.mi{width:56px;height:56px;flex:0 0 56px;border-radius:10px}
.m div{flex:1}
.m b{display:block;font-size:16px;font-weight:700;letter-spacing:-0.02em}
.m span{display:block;font-size:13px;color:#8C7466;margin-top:4px}
.mp{font-size:15px;font-weight:700}
.hours{display:flex;align-items:center;gap:10px;font-size:14px;color:#6B554A;padding-top:10px;border-top:1px solid #EFE0D0;margin-top:6px}
.scr>*{flex:0 0 auto}
.fix{margin-top:auto;background:#FFF6EC;border-top:1px solid #EFE0D0;padding:16px 20px 20px}
.cta{display:block;background:#E8452A;color:#fff;text-align:center;font-size:17px;font-weight:800;padding:20px 12px;border-radius:100px}
.optout{text-align:center;font-size:12px;color:#A08A7A;margin-top:12px}
</style>
</head>
<body>
