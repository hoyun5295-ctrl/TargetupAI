<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스텝업클래스 — 인앱메시지</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#E4E3EC;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(21,18,53,.28)}
.scr{position:relative;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#fff;color:#151235}
.app{position:absolute;inset:0;filter:blur(7px);transform:scale(1.06)}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.ah{padding:4px 20px 14px;display:flex;align-items:center;justify-content:space-between}
.ah b{font-size:17px;font-weight:800;letter-spacing:-0.035em}
.ah i{display:block;width:20px;height:20px;border:2px solid #151235;border-radius:50%}
.hero{margin:0 20px 14px;height:136px;background:#3D2BEA;border-radius:16px}
.row{margin:0 20px 11px;border:1.5px solid #E7E5F3;border-radius:12px;padding:17px}
.row .l1{height:11px;width:50%;background:#EDEBF7;border-radius:3px}
.row .l2{height:11px;width:72%;background:#F4F3FA;border-radius:3px;margin-top:11px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #EFEDF7;display:flex;align-items:center;justify-content:space-around;padding-bottom:14px}
.tabbar i{display:block;width:22px;height:22px;border:2px solid #C9C5DE;border-radius:5px}
.tabbar i:first-child{border-color:#3D2BEA}
.dim{position:absolute;inset:0;background:rgba(15,12,42,.58)}
.sheet{position:absolute;left:16px;right:16px;top:78px;bottom:34px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 28px 64px rgba(15,12,42,.5);display:flex;flex-direction:column}
/* 이미지 슬롯: inapp 1:1 */
.pic{position:relative;aspect-ratio:1/1;flex:0 0 auto;background:#eee}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(21,18,53,.45);display:flex;align-items:center;justify-content:center}
.tx{flex:1;padding:26px 26px 24px;display:flex;flex-direction:column}
.chip{align-self:flex-start;background:#FFE500;color:#151235;font-size:12px;font-weight:800;padding:7px 12px;border-radius:7px}
h1{font-size:27px;line-height:1.36;font-weight:800;letter-spacing:-0.036em;margin:15px 0 0;text-wrap:pretty}
.sub{font-size:15px;line-height:1.6;color:#6E6892;margin:10px 0 0}
.sp{flex:1;min-height:10px}
.cta{display:block;background:#3D2BEA;color:#fff;text-align:center;font-size:17px;font-weight:800;padding:19px 12px;border-radius:14px}
.later{display:block;text-align:center;font-size:14px;color:#8781A8;padding:14px 0 0}
</style>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="app">
    <div class="sb"><span>9:41</span><span>
      <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x=".6" y=".6" width="20" height="9.8" rx="3" fill="none" stroke="#151235" stroke-opacity=".5"/><rect x="2.3" y="2.3" width="12" height="6.4" rx="1.6" fill="#151235"/></svg>
    </span></div>
    <div class="ah"><b>내 강의실</b><i></i></div>
    <div class="hero"></div>
    <div class="row"><div class="l1"></div><div class="l2"></div></div>
    <div class="row"><div class="l1"></div><div class="l2"></div></div>
    <div class="row"><div class="l1"></div><div class="l2"></div></div>
    <div class="tabbar"><i></i><i style="border-radius:50%"></i><i></i><i style="border-radius:11px"></i></div>
  </div>
  <div class="dim"></div>

  <div class="sheet">
    <div class="pic slot">
      <img src="./assets/education-inapp.png" alt="">
      <a class="x" href="#"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1 11 11M11 1 1 11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>
    </div>
    <div class="tx">
      <span class="chip">조기등록 12/5까지</span>
      <h1>겨울방학이<br>3주 남았어요</h1>
      <p class="sub">수학 심화반 개강 · 수강료 15%</p>
      <div class="sp"></div>
      <a class="cta" href="#">시간표 확인하기</a>
      <a class="later" href="#">다음에 볼게요</a>
    </div>
  </div>
</div></div>
</body>
</html>
