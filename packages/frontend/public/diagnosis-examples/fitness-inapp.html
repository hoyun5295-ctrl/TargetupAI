<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무브짐 — 인앱메시지</title>
<style>
@font-face{font-family:'Pretendard Variable';src:url('./assets/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
.slot{background:#eee;overflow:hidden}
body{background:#DEDEE0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.phone{width:395px;height:832px;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 56px rgba(0,0,0,.32)}
.scr{position:relative;width:375px;height:812px;border-radius:37px;overflow:hidden;background:#0C0C0D;color:#fff}
.app{position:absolute;inset:0;filter:blur(7px);transform:scale(1.06)}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.ah{padding:4px 20px 14px;font-size:18px;font-weight:800;letter-spacing:-0.03em}
.hero{margin:0 20px 14px;height:140px;background:#17171A;border-radius:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.g .t{height:118px;background:#17171A;border-radius:12px}
.wide{margin:12px 20px 0;height:96px;background:#17171A;border-radius:12px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#050506;border-top:1px solid #232326;display:flex;align-items:center;justify-content:space-around;padding-bottom:14px}
.tabbar i{display:block;width:22px;height:22px;border:2px solid #3A3A3E;border-radius:5px}
.tabbar i:first-child{border-color:#D8FF00}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.card{position:absolute;left:24px;right:24px;top:200px;background:#17171A;border-radius:20px;overflow:hidden;box-shadow:0 26px 58px rgba(0,0,0,.6)}
/* 이미지 슬롯: inapp 1:1 */
.pic{position:relative;aspect-ratio:1/1;background:#222}
.x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.dd{position:absolute;top:14px;left:14px;background:#D8FF00;color:#0C0C0D;font-size:12px;font-weight:800;padding:6px 11px;border-radius:5px}
.tx{padding:24px 24px 22px}
h1{font-size:25px;line-height:1.38;font-weight:800;letter-spacing:-0.034em;margin:0;text-wrap:pretty}
.sub{font-size:14.5px;line-height:1.6;color:#9A9AA0;margin:10px 0 0}
.cta{display:block;background:#D8FF00;color:#0C0C0D;text-align:center;font-size:16.5px;font-weight:800;padding:17px 12px;border-radius:11px;margin-top:20px;letter-spacing:-0.02em}
.later{display:block;text-align:center;font-size:13.5px;color:#7A7A80;padding:13px 0 0}
</style>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="app">
    <div class="sb"><span>9:41</span><span>
      <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x=".6" y=".6" width="20" height="9.8" rx="3" fill="none" stroke="#fff" stroke-opacity=".55"/><rect x="2.3" y="2.3" width="12" height="6.4" rx="1.6" fill="#fff"/></svg>
    </span></div>
    <div class="ah">오늘의 운동</div>
    <div class="hero"></div>
    <div class="g"><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div></div>
    <div class="wide"></div>
    <div class="tabbar"><i></i><i style="border-radius:50%"></i><i></i><i style="border-radius:11px"></i></div>
  </div>
  <div class="dim"></div>

  <div class="card">
    <div class="pic slot">
      <img src="./assets/fitness-inapp.png" alt="">
      <span class="dd">D-7</span>
      <a class="x" href="#"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1 11 11M11 1 1 11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>
    </div>
    <div class="tx">
      <h1>회원권이<br>7일 뒤에 끝나요</h1>
      <p class="sub">지금 연장하면 최대 8주 추가 + PT 1회</p>
      <a class="cta" href="#">연장하기</a>
      <a class="later" href="#">나중에 하기</a>
    </div>
  </div>
</div></div>
</body>
</html>
